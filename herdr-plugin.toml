id = "process-name-split"
name = "Process Name Split"
version = "1.0.0"
min_herdr_version = "0.7.0"
description = "Show each split's current path or foreground process in its pane border."
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "daemon.mts", "start"]

[[actions]]
id = "sync"
title = "Sync process pane names now"
description = "Update pane border labels to each split's current path or foreground process."
command = ["node", "sync.mts"]

[[events]]
on = "tab.created"
command = ["node", "sync.mts"]

[[events]]
on = "tab.focused"
command = ["node", "sync.mts"]

[[events]]
on = "tab.moved"
command = ["node", "sync.mts"]

[[events]]
on = "pane.created"
command = ["node", "sync.mts"]

[[events]]
on = "pane.closed"
command = ["node", "sync.mts"]

[[events]]
on = "pane.exited"
command = ["node", "sync.mts"]

[[events]]
on = "pane.focused"
command = ["node", "sync.mts"]

[[events]]
on = "pane.moved"
command = ["node", "sync.mts"]

[[events]]
on = "pane.agent_detected"
command = ["node", "sync.mts"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "sync.mts"]

[[events]]
on = "workspace.focused"
command = ["node", "sync.mts"]

[[events]]
on = "worktree.opened"
command = ["node", "sync.mts"]
